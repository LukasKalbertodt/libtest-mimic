name: CI

on: [pull_request, push]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

jobs:
  style:
    name: Check basic style
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: LukasKalbertodt/check-basic-style@v0.1
      with:
        files: '**/!(*.md|*.json)'

  check:
    name: 'Build & test'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: cargo build
    - run: cargo test
    - run: cargo doc
